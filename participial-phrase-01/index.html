<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Причастный оборот</title><style>:root{--bg:#f5f7fb;--card:#fff;--text:#243044;--muted:#6f7c8f;--line:#dce3ed;--accent:#5271ff;--soft:#eef2ff;--good:#29965e;--goodbg:#ebfff4;--bad:#d55454;--badbg:#fff0f0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,"Segoe UI",sans-serif}.app{max-width:900px;margin:auto;padding:14px}.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 5px 18px rgba(30,45,70,.06)}.kicker{display:inline-block;padding:5px 10px;border-radius:16px;background:var(--soft);color:var(--accent);font-size:13px;font-weight:700}h1{font-size:24px;margin:8px 0}.lead{color:var(--muted);line-height:1.45;margin:0 0 14px}.cards{display:grid;gap:10px;margin:14px 0}.sentence-card{border:1px solid var(--line);border-radius:13px;background:#fff;padding:13px;text-align:left;font-size:16px;line-height:1.45;cursor:pointer}.sentence-card.selected{border-color:var(--accent);background:var(--soft)}.sentence-card.correct{border-color:var(--good);background:var(--goodbg)}.sentence-card.wrong{border-color:var(--bad);background:var(--badbg)}.tokens{display:flex;flex-wrap:wrap;gap:7px;line-height:1.8;margin:16px 0}.token{border:1px solid #cfd7e2;background:#fff;border-radius:8px;padding:7px 9px;font-size:16px;cursor:pointer}.token.selected{border-color:var(--accent);background:var(--soft)}.token.correct{border-color:var(--good);background:var(--goodbg)}.token.wrong{border-color:var(--bad);background:var(--badbg)}.nav{display:flex;gap:9px;align-items:center;margin-top:14px}.spacer{flex:1}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;font-size:14px;cursor:pointer}.primary{background:var(--accent);color:#fff}.secondary{background:#e8edf4;color:var(--text)}.result{min-height:22px;margin-top:10px;font-size:14px;font-weight:700}.good{color:var(--good)}.bad{color:var(--bad)}@media(max-width:560px){.app{padding:8px}.panel{padding:14px}h1{font-size:21px}.nav{flex-wrap:wrap}.spacer{display:none}.btn{flex:1}}</style></head><body><main class="app"><section id="panel" class="panel"></section></main><script>const data=[{n:5,text:'Часами занимались немцы, и они распространяли мнение, что русский человек не сможет постигнуть сложность часового механизма.'},{n:6,text:'Любовь к часам, беспристрастно выстукивающим время, появилась у Кулибина с детства и осталась навсегда.'},{n:7,text:'Что бы он ни делал, что бы ни изобретал, мысли его неумолимо возвращались к часам.'}];const targetSentence=6;const targetTokens=['беспристрастно','выстукивающим','время'];let stage=0,selectedSentence=null;const selectedTokens=new Set();const panel=document.getElementById('panel');function render(){stage===0?renderChoose():renderHighlight()}function renderChoose(){panel.innerHTML=`<div class="kicker">Задание 4</div><h1>Найди причастный оборот</h1><p class="lead">Выбери предложение, в котором есть причастный оборот.</p><div class="cards">${data.map(x=>`<button class="sentence-card ${selectedSentence===x.n?'selected':''}" data-n="${x.n}"><b>(${x.n})</b> ${x.text}</button>`).join('')}</div><div id="res" class="result"></div><div class="nav"><span class="spacer"></span><button id="check" class="btn primary">Проверить</button></div>`;document.querySelectorAll('.sentence-card').forEach(b=>b.onclick=()=>{selectedSentence=+b.dataset.n;renderChoose()});document.getElementById('check').onclick=checkSentence}function checkSentence(){const cards=[...document.querySelectorAll('.sentence-card')];cards.forEach(b=>{const n=+b.dataset.n;b.classList.remove('correct','wrong');if(n===selectedSentence)b.classList.add(n===targetSentence?'correct':'wrong')});const r=document.getElementById('res');if(selectedSentence===targetSentence){r.textContent='Верно. Теперь выдели сам причастный оборот.';r.className='result good';document.querySelector('.nav').innerHTML=`<button class="btn secondary" onclick="stage=0;render()">← Назад</button><span class="spacer"></span><button class="btn primary" onclick="stage=1;render()">Дальше →</button>`}else{r.textContent='Попробуй ещё раз.';r.className='result bad'}}function renderHighlight(){const words=['Любовь','к','часам,','беспристрастно','выстукивающим','время,','появилась','у','Кулибина','с','детства','и','осталась','навсегда.'];panel.innerHTML=`<div class="kicker">Причастный оборот</div><h1>Выдели оборот</h1><p class="lead">Нажми на все слова, входящие в причастный оборот.</p><div class="tokens">${words.map((w,i)=>`<button class="token ${selectedTokens.has(i)?'selected':''}" data-i="${i}">${w}</button>`).join('')}</div><div id="res" class="result"></div><div class="nav"><button class="btn secondary" onclick="stage=0;render()">← Назад</button><span class="spacer"></span><button id="check" class="btn primary">Проверить</button></div>`;document.querySelectorAll('.token').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;selectedTokens.has(i)?selectedTokens.delete(i):selectedTokens.add(i);renderHighlight()});document.getElementById('check').onclick=checkTokens}function checkTokens(){const correct=new Set([3,4,5]);let ok=selectedTokens.size===correct.size&&[...correct].every(i=>selectedTokens.has(i));document.querySelectorAll('.token').forEach(b=>{const i=+b.dataset.i;b.classList.remove('correct','wrong');if(selectedTokens.has(i))b.classList.add(correct.has(i)?'correct':'wrong')});const r=document.getElementById('res');r.textContent=ok?'Верно: беспристрастно выстукивающим время.':'Есть неточности. Проверь границы оборота.';r.className='result '+(ok?'good':'bad')}render();</script></body></html>
