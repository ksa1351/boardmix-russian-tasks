<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Наречия — найди и разбери</title><style>:root{--bg:#f5f7fb;--card:#fff;--text:#243044;--muted:#6f7c8f;--line:#dce3ed;--accent:#5271ff;--soft:#eef2ff;--good:#29965e;--goodbg:#ebfff4;--bad:#d55454;--badbg:#fff0f0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,"Segoe UI",sans-serif}.app{max-width:900px;margin:auto;padding:14px}.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 5px 18px rgba(30,45,70,.06)}.kicker{display:inline-block;padding:5px 10px;border-radius:16px;background:var(--soft);color:var(--accent);font-size:13px;font-weight:700}h1{font-size:24px;margin:8px 0}.lead{color:var(--muted);line-height:1.45;margin:0 0 14px}.source{background:#fafbfd;border:1px solid var(--line);border-radius:13px;padding:13px;line-height:1.55;margin:12px 0}.chips{display:flex;flex-wrap:wrap;gap:9px;margin:14px 0}.chip{border:1px solid #cfd7e2;background:#fff;border-radius:10px;padding:9px 13px;font-size:15px;font-weight:700;cursor:pointer}.chip.selected{border-color:var(--accent);background:var(--soft);outline:2px solid rgba(82,113,255,.12)}.chip.correct{border-color:var(--good);background:var(--goodbg)}.chip.wrong{border-color:var(--bad);background:var(--badbg)}.nav{display:flex;gap:9px;align-items:center;margin-top:14px}.spacer{flex:1}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;font-size:14px;cursor:pointer}.primary{background:var(--accent);color:#fff}.secondary{background:#e8edf4;color:var(--text)}.result{min-height:22px;margin-top:10px;font-size:14px;font-weight:700}.good{color:var(--good)}.bad{color:var(--bad)}.word{font-size:27px;font-weight:800;margin:12px 0 4px}.morph-row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start;margin:16px 0}.morph{display:flex;flex-direction:column;gap:6px;align-items:center}.segment{min-width:64px;text-align:center;padding:10px 12px;border-radius:10px;background:var(--soft);font-size:18px;font-weight:800}.morph select{border:1px solid #cfd7e2;border-radius:8px;padding:7px 8px;background:#fff;font-size:13px}.morph select.correct{border-color:var(--good);background:var(--goodbg)}.morph select.wrong{border-color:var(--bad);background:var(--badbg)}.progress{font-size:13px;color:var(--muted);font-weight:700}.summary{background:#fafbfd;border:1px solid var(--line);border-radius:13px;padding:14px;line-height:1.5}@media(max-width:560px){.app{padding:8px}.panel{padding:14px}h1{font-size:21px}.nav{flex-wrap:wrap}.spacer{display:none}.btn{flex:1}.segment{min-width:54px;font-size:16px}}</style></head><body><main class="app"><section id="panel" class="panel"></section></main><script>const sentences=['(6) Любовь к часам, беспристрастно выстукивающим время, появилась у Кулибина с детства и осталась навсегда.','(7) Что бы он ни делал, что бы ни изобретал, мысли его неумолимо возвращались к часам.'];const candidates=['беспристрастно','время','навсегда','делал','изобретал','мысли','неумолимо','возвращались','часам'];const targets=new Set(['беспристрастно','навсегда','неумолимо']);const parses=[{word:'беспристрастно',parts:[['бес','приставка'],['при','приставка'],['страст','корень'],['н','суффикс'],['о','суффикс']]},{word:'навсегда',parts:[['на','приставка'],['всегда','корень']]},{word:'неумолимо',parts:[['не','приставка'],['у','приставка'],['мол','корень'],['им','суффикс'],['о','суффикс']]}];let stage=0,parseIndex=0;const selected=new Set();const morphAnswers=parses.map(p=>Array(p.parts.length).fill(''));const panel=document.getElementById('panel');function render(){if(stage===0)return renderFind();if(stage===1)return renderParse();renderDone()}function renderFind(){panel.innerHTML=`<div class="kicker">Задание 3</div><h1>Найди наречия</h1><p class="lead">Прочитай предложения 6–7 и выбери только наречия.</p><div class="source">${sentences.join('<br>')}</div><div class="chips">${candidates.map(w=>`<button class="chip ${selected.has(w)?'selected':''}" data-w="${w}">${w}</button>`).join('')}</div><div id="res" class="result"></div><div class="nav"><span class="spacer"></span><button id="check" class="btn primary">Проверить</button></div>`;document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{b.classList.toggle('selected');selected.has(b.dataset.w)?selected.delete(b.dataset.w):selected.add(b.dataset.w);clearFindMarks()});document.getElementById('check').onclick=checkFind}function clearFindMarks(){document.querySelectorAll('.chip').forEach(b=>b.classList.remove('correct','wrong'));const r=document.getElementById('res');if(r){r.textContent='';r.className='result'}}function checkFind(){let ok=true;document.querySelectorAll('.chip').forEach(b=>{const should=targets.has(b.dataset.w),has=selected.has(b.dataset.w);b.classList.remove('correct','wrong');if(has&&should)b.classList.add('correct');else if(has&&!should){b.classList.add('wrong');ok=false}else if(!has&&should)ok=false});const r=document.getElementById('res');if(ok&&selected.size===targets.size){r.textContent='Верно. Переходим к морфемному разбору.';r.className='result good';const nav=document.querySelector('.nav');nav.innerHTML=`<button class="btn secondary" onclick="stage=0;render()">← Назад</button><span class="spacer"></span><button class="btn primary" onclick="stage=1;parseIndex=0;render()">К разбору →</button>`}else{r.textContent='Есть неточности. Исправь выбор и проверь ещё раз.';r.className='result bad'}}function renderParse(){const p=parses[parseIndex];panel.innerHTML=`<div class="kicker">Морфемный разбор</div><div class="progress">Слово ${parseIndex+1} из ${parses.length}</div><h1>Определи морфемы</h1><p class="lead">Для каждой части слова выбери её роль.</p><div class="word">${p.word}</div><div class="morph-row">${p.parts.map((part,i)=>`<div class="morph"><div class="segment">${part[0]}</div><select data-i="${i}"><option value="">?</option><option ${morphAnswers[parseIndex][i]==='приставка'?'selected':''}>приставка</option><option ${morphAnswers[parseIndex][i]==='корень'?'selected':''}>корень</option><option ${morphAnswers[parseIndex][i]==='суффикс'?'selected':''}>суффикс</option></select></div>`).join('')}</div><div id="res" class="result"></div><div class="nav"><button id="prev" class="btn secondary">← Назад</button><span class="spacer"></span><button id="check" class="btn primary">Проверить</button><button id="next" class="btn secondary">${parseIndex===parses.length-1?'Завершить →':'Дальше →'}</button></div>`;document.querySelectorAll('select').forEach(s=>s.onchange=()=>{morphAnswers[parseIndex][+s.dataset.i]=s.value;s.classList.remove('correct','wrong');document.getElementById('res').textContent=''});document.getElementById('prev').onclick=()=>{if(parseIndex===0){stage=0;render()}else{parseIndex--;render()}};document.getElementById('next').onclick=()=>{if(parseIndex===parses.length-1){stage=2;render()}else{parseIndex++;render()}};document.getElementById('check').onclick=()=>checkParse(p)}function checkParse(p){let c=0;document.querySelectorAll('select').forEach((s,i)=>{s.classList.remove('correct','wrong');if(morphAnswers[parseIndex][i]===p.parts[i][1]){s.classList.add('correct');c++}else s.classList.add('wrong')});const r=document.getElementById('res');r.textContent=c===p.parts.length?'Всё верно.':`Верно ${c} из ${p.parts.length}.`;r.className='result '+(c===p.parts.length?'good':'bad')}function renderDone(){let total=0,correct=0;parses.forEach((p,pi)=>p.parts.forEach((part,i)=>{total++;if(morphAnswers[pi][i]===part[1])correct++}));panel.innerHTML=`<div class="kicker">Готово</div><h1>Наречия и морфемный разбор</h1><div class="summary">Наречия найдены: <b>беспристрастно, навсегда, неумолимо</b>.<br>Морфемный разбор: <b>${correct} из ${total}</b> элементов верно.</div><div class="nav"><button class="btn secondary" onclick="stage=1;parseIndex=2;render()">← Назад</button><span class="spacer"></span><button class="btn primary" onclick="selected.clear();morphAnswers.forEach(a=>a.fill(''));stage=0;parseIndex=0;render()">Пройти заново</button></div>`}render();</script></body></html>
